<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A small stop-motion world built from what Tim Burton made and what shaped him.">
<meta name="theme-color" content="#0b090f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b090f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e9e0cd'/%3E%3Ccircle cx='20' cy='13' r='8' fill='%230b090f'/%3E%3C/svg%3E">
<title>Burton Machine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  /* One dark world: ink for the ground, bone for type, ember only where a hand can touch. */
  :root {
    --ink: #0b090f;
    --bone: #e9e0cd;
    --dim: #a79d8a;
    --ember: #e8913a;
    --face: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--bone); overflow: hidden; font-family: var(--face); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
  #ui { position: fixed; inset: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #ui > * { pointer-events: auto; }
  #ui::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(to bottom, rgba(7,5,10,.7), rgba(7,5,10,0)); pointer-events: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--ember); outline-offset: 4px; }

  .name { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 18px; font-style: italic; font-size: 1.15rem; color: var(--bone); text-shadow: 0 1px 6px #000; pointer-events: none; }
  .tr { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 16px; display: flex; gap: 20px; }
  .quiet { font-size: 1rem; color: var(--dim); text-shadow: 0 1px 6px #000; }
  .quiet:hover { color: var(--bone); }
  .modes { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: clamp(14px, 3vw, 38px); }
  .mode { font-size: 1.35rem; color: var(--dim); padding: 4px 2px; text-shadow: 0 1px 8px #000; }
  .mode:hover { color: var(--bone); }
  .mode[aria-current="true"] { color: var(--bone); text-decoration: underline wavy var(--ember) 1px; text-underline-offset: 7px; }
  .closest { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); font-style: italic; color: var(--bone); font-size: 1.05rem; text-shadow: 0 1px 8px #000, 0 0 2px #000; transition: opacity .3s; pointer-events: none; white-space: nowrap; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(7,5,10,.88) 0%, rgba(7,5,10,.62) 55%, rgba(7,5,10,0) 100%); }
  .view { max-width: 1100px; margin: 0 auto; }

  .life .head { display: flex; align-items: baseline; gap: 22px; margin-bottom: 6px; flex-wrap: wrap; }
  .year { font-size: clamp(2.6rem, 6vw, 4rem); line-height: 1; min-width: 4.4ch; font-variant-numeric: tabular-nums; }
  .what { font-style: italic; font-size: 1.3rem; }
  .facts { columns: 2 340px; column-gap: 40px; max-height: 38vh; overflow-y: auto; margin-bottom: 4px; }
  .facts p { margin: 0 0 6px; font-size: 1.02rem; line-height: 1.42; color: var(--bone); break-inside: avoid; }
  .track { position: relative; height: 56px; cursor: ew-resize; touch-action: none; }
  .track .line, .mtrack .line { position: absolute; left: 0; right: 0; top: 30px; height: 1px; background: var(--dim); opacity: .7; }
  .dec { position: absolute; top: 40px; transform: translateX(-50%); font-size: .8rem; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
  .pin { position: absolute; top: 18px; width: 12px; height: 26px; margin-left: -6px; cursor: pointer; }
  .pin::after { content: ''; position: absolute; left: 5px; top: 0; width: 2px; height: 12px; background: var(--bone); opacity: .75; }
  .pin.film::after { height: 12px; }
  .pin.life::after { background: var(--ember); height: 18px; top: -4px; }
  .pin.inf { display: none; }
  .pin:hover::after { opacity: 1; background: #fff; }
  .handle { position: absolute; top: 23px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--ember); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--ember); pointer-events: none; }

  .row { display: flex; justify-content: center; gap: clamp(8px, 2vw, 26px); overflow-x: auto; padding-bottom: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 56px; }
  .lbl { font-size: .9rem; color: var(--dim); white-space: nowrap; }
  .bottle, .stick { cursor: ns-resize; touch-action: none; color: var(--bone); line-height: 0; }
  .bottle:hover, .stick:hover { color: #fff; }
  .note { max-width: 86ch; margin: 8px auto 0; font-size: 1.02rem; line-height: 1.45; color: var(--bone); min-height: 4.4em; }
  .note em { font-style: italic; }
  .hint { text-align: center; color: var(--dim); font-style: italic; margin-top: 6px; font-size: .95rem; }
  .learned { display: block; margin: 10px auto 0; font-style: italic; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: center; padding: 8px 0; }
  select { font: inherit; font-size: 1.1rem; color: var(--bone); background: rgba(11,9,15,.6); border: 0; border-bottom: 1px solid var(--dim); padding: 6px 2px; width: 100%; min-width: 0; text-overflow: ellipsis; }
  select option { background: var(--ink); color: var(--bone); }
  .mtrack { position: relative; height: 56px; cursor: ew-resize; touch-action: none; }
  .mtrack .handle { top: 23px; }

  .graph { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 96px; bottom: 196px; background: rgba(7,5,10,.5); border-radius: 2px; }
  .graph svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .graph .gn { cursor: pointer; outline: none; }
  .graph .gn text { fill: var(--dim); font-family: var(--face); }
  .graph .gn circle { fill: var(--dim); }
  .graph .gn:hover text, .graph .gn:focus-visible text { fill: var(--bone); }
  .graph .gn.rel text { fill: var(--bone); }
  .graph .gn.rel circle { fill: var(--bone); }
  .graph .gn.sel text { fill: var(--ember); }
  .graph .gn.sel circle { fill: var(--ember); }
  .graph .ed { fill: none; stroke: var(--bone); stroke-opacity: .3; stroke-width: 1; transition: stroke-opacity .2s, stroke-width .2s; }
  .graph .ed.dim { stroke-opacity: .06; }
  .graph .ed.on { stroke: var(--ember); stroke-opacity: 1; stroke-width: 2; }
  .graph .ed.near { stroke: var(--bone); stroke-opacity: .55; stroke-dasharray: 3 5; stroke-width: 1.4; }
  .detail { min-height: 130px; max-height: 150px; overflow-y: auto; max-width: 86ch; margin: 0 auto; }
  .detail p { margin: 0 0 6px; line-height: 1.45; font-size: 1.02rem; }
  .detail p.small { color: var(--dim); font-size: .95rem; }
  .detail em { font-style: italic; }

  .pbar { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 6px 14px; background: rgba(7,5,10,.78); border: 1px solid rgba(233,224,205,.25); white-space: nowrap; }
  .pbar[hidden], .pcard[hidden] { display: none; }
  .pwhere { color: var(--dim); font-size: .95rem; }
  .pprog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
  .pprog i { display: block; height: 2px; width: 0; background: var(--ember); }
  .pcard { position: absolute; left: 50%; top: 24vh; transform: translateX(-50%); width: min(640px, calc(100vw - 48px)); margin: 0; padding: 22px 26px; background: rgba(7,5,10,.82); border: 1px solid rgba(233,224,205,.25); font-size: 1.35rem; line-height: 1.45; text-align: center; pointer-events: none; }
  .presenting .panel { pointer-events: none; }
  .presenting .closest { display: none; }
  .presenting .modes { pointer-events: none; }
  .presenting .graph { pointer-events: none; }

  .sheet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; background: var(--ink); border: 1px solid var(--dim); padding: 24px 28px; }
  .sheet h2 { margin: 0 0 10px; font-weight: normal; font-style: italic; font-size: 1.5rem; }
  .sheet p { margin: 0 0 12px; line-height: 1.5; color: var(--bone); }
  .sheet ul { margin: 0 0 16px; padding-left: 18px; line-height: 1.7; }
  .sheet a { color: var(--bone); text-underline-offset: 3px; }

  #intro { position: fixed; inset: 0; z-index: 20; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 24px; transition: opacity 1.1s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { margin: 0; font-weight: normal; font-size: clamp(2.8rem, 9vw, 6rem); letter-spacing: .01em; }
  #intro p { margin: 0; color: var(--dim); font-style: italic; font-size: 1.15rem; max-width: 40ch; }
  #intro button { font-size: 1.5rem; padding: 6px 4px; border-bottom: 1px solid var(--ember); }
  #intro button:disabled { color: var(--dim); border-color: transparent; cursor: default; }

  @media (max-width: 760px) {
    .mode { font-size: 1.1rem; } .name { display: none; } .tr { top: 46px; } .closest { top: 78px; font-size: .95rem; } .modes { top: 10px; }
    .pair { grid-template-columns: 1fr; gap: 4px; } .facts p { font-size: .95rem; } .facts { max-height: 30vh; }
    .graph { bottom: 262px; } .detail { max-height: 170px; } .modes { gap: 9px; } .mode { font-size: 1rem; } .tr { gap: 14px; } .pbar { top: 76px; gap: 10px; padding: 6px 10px; } .pwhere { display: none; } .pcard { font-size: 1.1rem; top: 22vh; }
  }
  @media (prefers-reduced-motion: reduce) { #intro { transition: none; } }
</style>


</head>
<body>
<canvas id="stage" aria-label="A small stop-motion world that changes with each part of Tim Burton's career"></canvas>
<div id="ui"></div>
<div id="intro">
  <h1>Burton Machine</h1>
  <p>A small stop-motion world, rebuilt from what Tim Burton made and what shaped him.</p>
  <button type="button" disabled>The models are training.</button>
</div>
<script src="app.js"></script>

</body>
</html>
